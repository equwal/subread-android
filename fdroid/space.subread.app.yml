MaintainerNotes: |-
  app/src/main/assets/models/ggml-tiny-q8_0.bin is the OpenAI Whisper "tiny"
  speech model (MIT), converted to the ggml format with
  third_party/whisper.cpp/models/convert-pt-to-ggml.py and quantized with
  whisper.cpp's quantize tool. It is data, not code. The app has no network
  permission, so it cannot download the model at run time.
  third_party/whisper.cpp/{bindings,examples,models} are not part of the build:
  app/src/main/cpp/CMakeLists.txt sets WHISPER_BUILD_EXAMPLES=OFF.

